description: Auto Shift with physical hold-tap timing and shared Shift overrides
compatible: "zmk,behavior-auto-shift"
include: one_param.yaml

properties:
  tapping-term-ms:
    type: int
    default: 175
  overrides-layer:
    type: int
    default: -1
    description: Highest active layer on key press where overrides apply (-1 for all layers)
  overrides:
    type: array
    required: true
    description: Pairs of unshifted and shifted encoded keycodes
